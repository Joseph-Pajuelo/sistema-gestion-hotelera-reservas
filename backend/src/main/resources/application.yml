spring:
  application:
    name: hotel-management-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hotel_db}
    username: ${SPRING_DATASOURCE_USERNAME:hotel_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:hotel_secret_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
